---
services:

  builder:
    build:
      context: ./docker/builder/

    environment:
      # @rollup/plugin-typescript compiles through its own TypeScript watcher and, on
      # each rebuild, waits only briefly for it before reusing the previous output.
      # Host edits on a Windows bind mount never reach that watcher through inotify,
      # so TypeScript polls every file at its fastest rate instead. Do not switch to
      # PriorityPollingInterval: it shares fs.watchFile with rollup's chokidar, which
      # drops TypeScript's listener after the first change.
      - TSC_WATCHFILE=DynamicPriorityPolling
      # Larger than the number of files in the program, so each poll covers all of them
      - TSC_WATCH_POLLINGCHUNKSIZE_LOW=10000
      # Never demote an idle file to the slower polling queues
      - TSC_WATCH_UNCHANGEDPOLLTHRESHOLDS_LOW=2147483647

    ports:
      - 3000:3000

    volumes:
      - .:/project

      # Keep node_modules only inside a volume (for decluttering and performance)
      - nodemodules_builder:/project/node_modules

      # Sync time with host
      - "/etc/localtime:/etc/localtime:ro"

    working_dir: /project

    command: ./scripts/build.sh --serve


  hass:
    image: homeassistant/home-assistant:beta

    environment:
      - SWIPE_NAVIGATION_JS_URL=http://localhost:3000/swipe-navigation.js

    ports:
      - 8123:8123

    volumes:
      - .hass/hass-init.sh:/etc/cont-init.d/hass-init.sh:ro
      - .hass/config/configuration.yaml:/config/configuration.yaml:ro
      - .hass/config/dashboards.yaml:/config/dashboards.yaml:ro
      - .hass/config/dashboards/:/config/dashboards
      - .hass/config/packages:/config/packages
      - .hass/config/www/touchpoints-visualizer.js:/config/www/touchpoints-visualizer.js:ro

      # Sync time with host
      - "/etc/localtime:/etc/localtime:ro"

    stop_grace_period: 1m


volumes:
  nodemodules_builder:
